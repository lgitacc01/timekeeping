- hosts: app
  become: true

  tasks:

    - name: Install Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Clone repo
      git:
        repo: "https://github.com/lgitacc01/timekeeping.git"
        dest: /root/timekeeping
        version: deploy
        force: yes

    # =========================
    # BACKEND ENV
    # =========================
    - name: Create backend .env
      copy:
        dest: /root/timekeeping/backend/.env
        content: |
          DB_NAME={{ db_name }}
          MONGO_URI={{ mongo_uri }}

    # =========================
    # BACKEND
    # =========================
    - name: Stop old backend
      command: docker rm -f backend
      ignore_errors: yes

    - name: Build backend
      command: docker build -t backend /root/timekeeping/backend

    - name: Run backend
      command: >
        docker run -d --restart=always
        --name backend
        -p 5000:5000
        --env-file /root/timekeeping/backend/.env
        backend

    # =========================
    # FRONTEND
    # =========================
    - name: Stop old frontend
      command: docker rm -f frontend
      ignore_errors: yes

    - name: Build frontend
      command: docker build --no-cache -t frontend /root/timekeeping/frontend
      async: 600
      poll: 10

    - name: Run frontend
      command: >
        docker run -d --restart=always
        --name frontend
        -p 5173:5173
        frontend


# =========================
# LOAD BALANCER
# =========================
- hosts: lb
  become: true

  tasks:

    - name: Install Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Configure LB
      copy:
        dest: /etc/nginx/sites-available/default
        content: |
          upstream frontend {
              server {{ app1_ip }}:5173;
              server {{ app2_ip }}:5173;
          }

          upstream backend {
              server {{ app1_ip }}:5000;
              server {{ app2_ip }}:5000;
          }

          server {
              listen 80;

              location / {
                  proxy_pass http://frontend;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }

              location /api/ {
                  rewrite ^/api/(.*)$ /$1 break;
                  proxy_pass http://backend;

                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }

    - name: Test Nginx
      command: nginx -t

    - name: Restart Nginx
      service:
        name: nginx
        state: restarted