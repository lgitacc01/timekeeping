version: "3.9"

services:

  backend:
    build: ./backend

    container_name: flask_backend

    volumes:
      - ./backend:/app

    environment:
      - FLASK_ENV=development

    expose:
      - "5000"

  frontend:
    build: ./frontend

    container_name: react_frontend

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true

    stdin_open: true
    tty: true

    expose:
      - "5173"

    depends_on:
      - backend

  nginx:
    image: nginx:latest

    container_name: nginx_proxy

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend